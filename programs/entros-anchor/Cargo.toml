[package]
name = "entros-anchor"
version = "0.1.0"
edition = "2021"
description = "Non-transferable identity token for Entros Protocol"

[lib]
crate-type = ["cdylib", "lib"]
name = "entros_anchor"

[features]
default = []
request-bound-v1 = ["entros-proof-request/request-bound-v1"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["entros-proof-request/idl-build","anchor-lang/idl-build", "anchor-spl/idl-build"]
debug-logs = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token_2022", "token_2022_extensions", "associated_token"] }
blake3 = "=1.8.2"
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
solana-security-txt = "1.1.2"
solana-instructions-sysvar = "=3.0.1"
entros-proof-request = { path = "../../crates/proof-request" }
